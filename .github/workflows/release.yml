name: Release

# Builds an arm64 image in GitHub Actions and deploys it to the single EC2
# instance. No static AWS credentials: GitHub's OIDC token is exchanged for a
# short-lived role session (see deploy/github-oidc-bootstrap.sh).
#
#   push to master   -> builds and pushes :sha-<7> only (no deploy)
#   tag v*           -> builds and pushes :v1.2.3 + :latest, then deploys
#   manual dispatch  -> deploys an existing tag (rollback)

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy (rollback), e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "290719180191"
  AWS_ROLE_ARN: arn:aws:iam::290719180191:role/kjit-classroom-github-deploy
  ECR_REPOSITORY: kjit-classroom
  INSTANCE_ID: i-04fdf15567813a6a0
  APP_HOST: 3-109-190-247.sslip.io

jobs:
  build:
    if: github.event_name == 'push'
    # Public repo: arm64 hosted runners are free. The instance is t4g (arm64),
    # so building here avoids QEMU and the on-box swap build entirely.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-build-${{ github.run_id }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          REG="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tags=$REG:$GITHUB_REF_NAME,$REG:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$REG:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Single manifest per push: avoids the untagged attestation digests
          # that would otherwise accumulate in the repository.
          provenance: false

  deploy:
    needs: [build]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    # Adds a deploy approval gate once reviewers are configured on this
    # environment; with no reviewers it deploys immediately.
    environment: Production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Resolve image
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Deploy via SSM RunCommand
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          jq -n --arg image "$IMAGE" '{commands: [
            "set -eu",
            "cd /opt/kjit-classroom/src/deploy",
            ("sed -i \"s|^APP_IMAGE=.*|APP_IMAGE=" + $image + "|\" .env"),
            "docker compose pull app",
            "docker compose up -d --no-build app",
            "docker compose ps app"
          ]}' > /tmp/params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $IMAGE" \
            --parameters file:///tmp/params.json \
            --query 'Command.CommandId' --output text)
          echo "command id: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

          [[ "$STATUS" == "Success" ]]

      - name: Verify public health
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 10 "https://$APP_HOST/api/health" | grep -q '"ok":true'; then
              echo "healthy"
              exit 0
            fi
            sleep 6
          done
          echo "health check failed"
          curl -sS --max-time 10 "https://$APP_HOST/api/health" || true
          exit 1
